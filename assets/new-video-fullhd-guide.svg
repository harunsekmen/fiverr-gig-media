<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">FULL HD VIDEO FRAME: 1920 by 1080 pixels</title>
<desc id="desc">Red margins avoid important content; green is a suggested content area. Optional text guide, not an official Fiverr safe zone. Artwork bounds 156, 0, 1608, 1080; text bounds 216, 60, 1488, 960. Hide guides before final export.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 H 0 V 20" fill="none" stroke="#656565" stroke-opacity="0.12" stroke-width="1"/></pattern>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M -3 3 L 3 -3 M 0 12 L 12 0 M 9 15 L 15 9" stroke="#b02020" stroke-opacity="0.15" fill="none"/></pattern>
</defs>
<g id="guides" font-family="Arial, Helvetica, sans-serif">
<g id="guide-fills">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="1080" fill="#f5b1b1"/>
  <rect id="artwork-area" x="156" y="0" width="1608" height="1080" fill="#d0efce"/>
  <rect id="green-content-area" x="216" y="60" width="1488" height="960" fill="#c2edbd"/>
<rect id="left-buffer" x="0" y="0" width="156" height="1080" fill="url(#hatch)"/>
<rect id="right-buffer" x="1764" y="0" width="156" height="1080" fill="url(#hatch)"/>
<rect x="0" y="0" width="1920" height="1080" fill="url(#grid)"/>
</g>
<g id="guide-lines" fill="none" stroke="#111111">
<rect x="1" y="1" width="1918" height="1078" stroke-width="2"/>
<rect id="optional-text-guide" x="216" y="60" width="1488" height="960" stroke-width="3.0" stroke-dasharray="18.0 12.0"/>
<path d="M 156 0 V 1080 M 1764 0 V 1080" stroke-width="3.0"/>
</g>
<g id="annotations">
<text x="960.0" y="165.0" text-anchor="middle" font-size="37.5" font-weight="700" fill="#111111" >FULL HD VIDEO FRAME · 1920 × 1080 px</text>
<text x="960.0" y="510.0" text-anchor="middle" font-size="69.0" font-weight="700" fill="#176820" >TEXT SAFE AREA</text>
<text x="960.0" y="588.0" text-anchor="middle" font-size="48.0" font-weight="700" fill="#111111" >1488 × 960 px</text>
<text x="960.0" y="655.5" text-anchor="middle" font-size="34.5" font-weight="400" fill="#111111" >Optional 60 px inner text inset</text>
<text x="960.0" y="892.5" text-anchor="middle" font-size="33.0" font-weight="400" fill="#111111" >Cover artwork: 1608 × 1080 px</text>
<text x="960.0" y="948.0" text-anchor="middle" font-size="27.0" font-weight="400" fill="#111111" >Working guide, not an official Fiverr safe zone</text>
<text x="78.0" y="540.0" text-anchor="middle" font-size="27.0" font-weight="700" fill="#111111" transform="rotate(-90 78.0 540.0)">156 px · background only</text>
<text x="1842.0" y="540.0" text-anchor="middle" font-size="27.0" font-weight="700" fill="#111111" transform="rotate(-90 1842.0 540.0)">156 px · background only</text>
</g>
</g>
</svg>
