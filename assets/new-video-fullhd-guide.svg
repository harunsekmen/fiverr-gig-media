<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">NEW FULL HD VIDEO GUIDE: 1920 by 1080 pixels</title>
  <desc id="desc">Scaled HD guide; live card unverified. Artwork bounds: x 156, y 0, width 1608, height 1080. Optional text bounds: x 216, y 60, width 1488, height 960. Guide only; remove before final export.</desc>
  <g id="guides" font-family="Arial, Helvetica, sans-serif">
    <g id="guide-fills">
      <rect id="canvas-background" x="0" y="0" width="1920" height="1080" fill="#f6f8fb"/>
      <rect id="artwork-area" x="156" y="0" width="1608" height="1080" fill="#def5f1"/>
<rect id="left-buffer" x="0" y="0" width="156" height="1080" fill="#ffedc0"/>
<rect id="right-buffer" x="1764" y="0" width="156" height="1080" fill="#ffedc0"/>
</g>
<g id="guide-lines" fill="none">
<rect id="canvas-outline" x="1" y="1" width="1918" height="1078" stroke="#10253e" stroke-width="2"/>
<path d="M 156 0 V 1080 M 1764 0 V 1080" stroke="#b07900" stroke-width="3.0"/>
<rect id="optional-text-guide" x="216" y="60" width="1488" height="960" stroke="#087f79" stroke-width="3.0" stroke-dasharray="18.0 12.0"/>
</g>
<g id="annotations">
<text x="960.0" y="142.5" text-anchor="middle" font-size="39.0" font-weight="700" fill="#10253e" >NEW FULL HD VIDEO GUIDE</text>
<text x="960.0" y="199.5" text-anchor="middle" font-size="34.5" font-weight="400" fill="#10253e" >Outer canvas: 1920 × 1080 px</text>
<text x="960.0" y="472.5" text-anchor="middle" font-size="57.0" font-weight="700" fill="#10253e" >Artwork: 1608 × 1080 px</text>
<text x="960.0" y="549.0" text-anchor="middle" font-size="37.5" font-weight="700" fill="#10253e" >Optional text guide: 1488 × 960 px</text>
<text x="960.0" y="612.0" text-anchor="middle" font-size="30.0" font-weight="400" fill="#10253e" >Text inset inside artwork: 60 px horizontally / 60 px vertically</text>
<text x="960.0" y="880.5" text-anchor="middle" font-size="27.0" font-weight="400" fill="#10253e" >Scaled HD guide; live card unverified.</text>
<text x="960.0" y="934.5" text-anchor="middle" font-size="27.0" font-weight="400" fill="#10253e" >Working guide; no universal Fiverr safe-zone guarantee.</text>
<text x="960.0" y="988.5" text-anchor="middle" font-size="25.5" font-weight="400" fill="#10253e" >Hide the guides group before exporting your finished cover.</text>
<text x="78.0" y="540.0" text-anchor="middle" font-size="28.5" font-weight="700" fill="#10253e" transform="rotate(-90 78.0 540.0)">156 px · background only</text>
<text x="1842.0" y="540.0" text-anchor="middle" font-size="28.5" font-weight="700" fill="#10253e" transform="rotate(-90 1842.0 540.0)">156 px · background only</text>
</g>
</g>
</svg>
