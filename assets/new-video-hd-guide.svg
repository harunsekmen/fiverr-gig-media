<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">HD VIDEO FRAME: 1280 by 720 pixels</title>
<desc id="desc">Red margins avoid important content; green is a suggested content area. Optional text guide, not an official Fiverr safe zone. Artwork bounds 104, 0, 1072, 720; text bounds 144, 40, 992, 640. Hide guides before final export.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 H 0 V 20" fill="none" stroke="#656565" stroke-opacity="0.12" stroke-width="1"/></pattern>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M -3 3 L 3 -3 M 0 12 L 12 0 M 9 15 L 15 9" stroke="#b02020" stroke-opacity="0.15" fill="none"/></pattern>
</defs>
<g id="guides" font-family="Arial, Helvetica, sans-serif">
<g id="guide-fills">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="720" fill="#f5b1b1"/>
  <rect id="artwork-area" x="104" y="0" width="1072" height="720" fill="#d0efce"/>
  <rect id="green-content-area" x="144" y="40" width="992" height="640" fill="#c2edbd"/>
<rect id="left-buffer" x="0" y="0" width="104" height="720" fill="url(#hatch)"/>
<rect id="right-buffer" x="1176" y="0" width="104" height="720" fill="url(#hatch)"/>
<rect x="0" y="0" width="1280" height="720" fill="url(#grid)"/>
</g>
<g id="guide-lines" fill="none" stroke="#111111">
<rect x="1" y="1" width="1278" height="718" stroke-width="2"/>
<rect id="optional-text-guide" x="144" y="40" width="992" height="640" stroke-width="2.0" stroke-dasharray="12.0 8.0"/>
<path d="M 104 0 V 720 M 1176 0 V 720" stroke-width="2.0"/>
</g>
<g id="annotations">
<text x="640.0" y="110.0" text-anchor="middle" font-size="25.0" font-weight="700" fill="#111111" >HD VIDEO FRAME · 1280 × 720 px</text>
<text x="640.0" y="340.0" text-anchor="middle" font-size="46.0" font-weight="700" fill="#176820" >TEXT SAFE AREA</text>
<text x="640.0" y="392.0" text-anchor="middle" font-size="32.0" font-weight="700" fill="#111111" >992 × 640 px</text>
<text x="640.0" y="437.0" text-anchor="middle" font-size="23.0" font-weight="400" fill="#111111" >Optional 40 px inner text inset</text>
<text x="640.0" y="595.0" text-anchor="middle" font-size="22.0" font-weight="400" fill="#111111" >Cover artwork: 1072 × 720 px</text>
<text x="640.0" y="632.0" text-anchor="middle" font-size="18.0" font-weight="400" fill="#111111" >Working guide, not an official Fiverr safe zone</text>
<text x="52.0" y="360.0" text-anchor="middle" font-size="18.0" font-weight="700" fill="#111111" transform="rotate(-90 52.0 360.0)">104 px · background only</text>
<text x="1228.0" y="360.0" text-anchor="middle" font-size="18.0" font-weight="700" fill="#111111" transform="rotate(-90 1228.0 360.0)">104 px · background only</text>
</g>
</g>
</svg>
