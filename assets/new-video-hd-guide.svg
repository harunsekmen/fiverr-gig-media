<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NEW HD VIDEO GUIDE: 1280 by 720 pixels</title>
  <desc id="desc">16:9 with reference-derived buffers; live card unverified. Artwork bounds: x 104, y 0, width 1072, height 720. Optional text bounds: x 144, y 40, width 992, height 640. Guide only; remove before final export.</desc>
  <g id="guides" font-family="Arial, Helvetica, sans-serif">
    <g id="guide-fills">
      <rect id="canvas-background" x="0" y="0" width="1280" height="720" fill="#f6f8fb"/>
      <rect id="artwork-area" x="104" y="0" width="1072" height="720" fill="#def5f1"/>
<rect id="left-buffer" x="0" y="0" width="104" height="720" fill="#ffedc0"/>
<rect id="right-buffer" x="1176" y="0" width="104" height="720" fill="#ffedc0"/>
</g>
<g id="guide-lines" fill="none">
<rect id="canvas-outline" x="1" y="1" width="1278" height="718" stroke="#10253e" stroke-width="2"/>
<path d="M 104 0 V 720 M 1176 0 V 720" stroke="#b07900" stroke-width="2.0"/>
<rect id="optional-text-guide" x="144" y="40" width="992" height="640" stroke="#087f79" stroke-width="2.0" stroke-dasharray="12.0 8.0"/>
</g>
<g id="annotations">
<text x="640.0" y="95.0" text-anchor="middle" font-size="26.0" font-weight="700" fill="#10253e" >NEW HD VIDEO GUIDE</text>
<text x="640.0" y="133.0" text-anchor="middle" font-size="23.0" font-weight="400" fill="#10253e" >Outer canvas: 1280 × 720 px</text>
<text x="640.0" y="315.0" text-anchor="middle" font-size="38.0" font-weight="700" fill="#10253e" >Artwork: 1072 × 720 px</text>
<text x="640.0" y="366.0" text-anchor="middle" font-size="25.0" font-weight="700" fill="#10253e" >Optional text guide: 992 × 640 px</text>
<text x="640.0" y="408.0" text-anchor="middle" font-size="20.0" font-weight="400" fill="#10253e" >Text inset inside artwork: 40 px horizontally / 40 px vertically</text>
<text x="640.0" y="587.0" text-anchor="middle" font-size="18.0" font-weight="400" fill="#10253e" >16:9 with reference-derived buffers; live card unverified.</text>
<text x="640.0" y="623.0" text-anchor="middle" font-size="18.0" font-weight="400" fill="#10253e" >Working guide; no universal Fiverr safe-zone guarantee.</text>
<text x="640.0" y="659.0" text-anchor="middle" font-size="17.0" font-weight="400" fill="#10253e" >Hide the guides group before exporting your finished cover.</text>
<text x="52.0" y="360.0" text-anchor="middle" font-size="19.0" font-weight="700" fill="#10253e" transform="rotate(-90 52.0 360.0)">104 px · background only</text>
<text x="1228.0" y="360.0" text-anchor="middle" font-size="19.0" font-weight="700" fill="#10253e" transform="rotate(-90 1228.0 360.0)">104 px · background only</text>
</g>
</g>
</svg>
