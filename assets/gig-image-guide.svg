<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="769" viewBox="0 0 1280 769" role="img" aria-labelledby="title desc">
  <title id="title">STANDALONE GIG IMAGE: 1280 by 769 pixels</title>
  <desc id="desc">Official recommended canvas; text insets are optional. Artwork bounds: x 0, y 0, width 1280, height 769. Optional text bounds: x 104, y 48, width 1072, height 673. Guide only; remove before final export.</desc>
  <g id="guides" font-family="Arial, Helvetica, sans-serif">
    <g id="guide-fills">
      <rect id="canvas-background" x="0" y="0" width="1280" height="769" fill="#f6f8fb"/>
      <rect id="artwork-area" x="0" y="0" width="1280" height="769" fill="#def5f1"/>
</g>
<g id="guide-lines" fill="none">
<rect id="canvas-outline" x="1" y="1" width="1278" height="767" stroke="#10253e" stroke-width="2"/>
<rect id="optional-text-guide" x="104" y="48" width="1072" height="673" stroke="#087f79" stroke-width="2.0" stroke-dasharray="12.0 8.0"/>
</g>
<g id="annotations">
<text x="640.0" y="95.0" text-anchor="middle" font-size="26.0" font-weight="700" fill="#10253e" >STANDALONE GIG IMAGE</text>
<text x="640.0" y="133.0" text-anchor="middle" font-size="23.0" font-weight="400" fill="#10253e" >Outer canvas: 1280 × 769 px</text>
<text x="640.0" y="339.5" text-anchor="middle" font-size="38.0" font-weight="700" fill="#10253e" >Artwork: 1280 × 769 px</text>
<text x="640.0" y="390.5" text-anchor="middle" font-size="25.0" font-weight="700" fill="#10253e" >Optional text guide: 1072 × 673 px</text>
<text x="640.0" y="432.5" text-anchor="middle" font-size="20.0" font-weight="400" fill="#10253e" >Text inset inside artwork: 104 px horizontally / 48 px vertically</text>
<text x="640.0" y="636.0" text-anchor="middle" font-size="18.0" font-weight="400" fill="#10253e" >Official recommended canvas; text insets are optional.</text>
<text x="640.0" y="672.0" text-anchor="middle" font-size="18.0" font-weight="400" fill="#10253e" >Working guide; no universal Fiverr safe-zone guarantee.</text>
<text x="640.0" y="708.0" text-anchor="middle" font-size="17.0" font-weight="400" fill="#10253e" >Hide the guides group before exporting your finished cover.</text>
<text x="52.0" y="384.5" text-anchor="middle" font-size="18.0" font-weight="700" fill="#10253e" transform="rotate(-90 52.0 384.5)">104 px optional text inset</text>
<text x="1228.0" y="384.5" text-anchor="middle" font-size="18.0" font-weight="700" fill="#10253e" transform="rotate(-90 1228.0 384.5)">104 px optional text inset</text>
<text x="640.0" y="30" text-anchor="middle" font-size="17.0" font-weight="400" fill="#10253e" >48 px optional text inset</text>
<text x="640.0" y="753" text-anchor="middle" font-size="17.0" font-weight="400" fill="#10253e" >48 px optional text inset</text>
</g>
</g>
</svg>
